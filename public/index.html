<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#244b3d"><title>BBQの買い出し</title><link rel="stylesheet" href="./style.css"></head><body><header><span class="brand">BBQ / TOGETHER</span><span id="connection" role="status">準備中</span></header><main><section class="hero"><div><p class="eyebrow">みんなで準備、あとは楽しむだけ。</p><h1>BBQの買い出し<span>忘れものなく、いい一日に。</span></h1></div><div class="grill" aria-hidden="true">♨</div></section><p id="notice" role="status"></p><section id="welcome" hidden class="panel"><h2>買い出しリストをつくる</h2><p>リストを作成して、URLを参加者に送りましょう。</p><button id="create">新しい共有リストを作成</button></section><section id="board" hidden><div class="toolbar"><label>あなたの名前（任意）<input id="person" maxlength="40" placeholder="例：ゆうすけ"></label><button id="share" class="secondary">共有URLをコピー</button></div><section class="progress panel"><div><strong id="count">0 / 0</strong><span>購入済み</span></div><progress id="progress" max="1" value="0"></progress></section><section class="panel"><h2 id="formTitle">買うものを追加</h2><form id="itemForm"><label class="wide">品名<input name="name" required maxlength="100" placeholder="牛肉、炭、紙皿など"></label><label>数量<input name="quantity" maxlength="40" placeholder="1kg / 10個"></label><label>カテゴリー<select name="category"><option>食材</option><option>飲み物</option><option>道具</option><option>その他</option></select></label><label>担当者<input name="assignee" maxlength="40" placeholder="未定"></label><label>メモ<input name="note" maxlength="300" placeholder="種類や希望など"></label><div class="wide actions"><button type="submit">追加する</button><button type="button" id="cancel" class="secondary" hidden>編集をやめる</button></div></form></section><div class="listhead"><h2>買い出しリスト</h2><select id="filter" aria-label="表示する項目"><option value="all">すべて</option><option value="todo">未購入</option><option value="done">購入済み</option></select></div><div id="items"></div></section><footer>ひとつのリストを、みんなで。<br>共有URLを知っている人は閲覧・編集できます。</footer></main><script type="module" src="./app.js"></script></body></html>
